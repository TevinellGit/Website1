<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form action="index.php" method="POST">

        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Spongebob" minlength="6" maxlength="15">

        <br><label for="password">Password:</label>
        <input type="password" id="password">

        <br><label for="email">Email:</label>
        <input type="email" id="email" placeholder="Ssquarepants@gmail.com">

        <br><label for="phone">Phone #:</label>
        <input type="tel" id="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
         

        <br><input type="reset"><br>
        <input type="submit">

    </form>
    
</body>
</html>
